<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Downstream</title>
    <style>
        * {box - sizing: border-box; margin: 0; padding: 0; }
        body {
          width: 280px;
        padding: 14px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1b26;
        color: #c0caf5;
        font-size: 12px;
      }
        .header {
          display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
        .title {font - weight: 600; font-size: 13px; color: #7aa2f7; }
        .status-badge {
          font - size: 10px;
        padding: 2px 6px;
        border-radius: 9999px;
        background: rgba(255,255,255,0.06);
      }
        .status-badge.online {background: rgba(115, 218, 202, 0.15); color: #73daca; }
        .status-badge.offline {background: rgba(247, 118, 142, 0.15); color: #f7768e; }

        .setting-group {margin - bottom: 12px; }
        .setting-label {font - size: 11px; color: #a9b1d6; margin-bottom: 6px; display: block; font-weight: 500; }

        .toggle-row {
          display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
        .btn-group {
          display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
        .btn {
          background: #24283b;
        border: 1px solid rgba(255,255,255,0.1);
        color: #7982a9;
        padding: 6px;
        font-size: 11px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.15s;
      }
        .btn:hover {color: #c0caf5; }
        .btn.active {
          background: rgba(115, 218, 202, 0.15);
        border-color: #73daca;
        color: #73daca;
      }
        .footer-note {
          font - size: 10px;
        color: #565f89;
        margin-top: 8px;
        line-height: 1.3;
      }
        kbd {
          background: rgba(255,255,255,0.1);
        padding: 1px 4px;
        border-radius: 3px;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="title">Downstream</span>
      <span id="hostStatus" class="status-badge">Checking...</span>
    </div>

    <div class="toggle-row">
      <span>Enable Interception</span>
      <input type="checkbox" id="toggleInterception" checked />
    </div>

    <div class="setting-group">
      <span class="setting-label">Download Action</span>
      <div class="btn-group">
        <button type="button" id="btnPrompt" class="btn active">Prompt</button>
        <button type="button" id="btnAuto" class="btn">Auto</button>
      </div>
    </div>

    <div class="footer-note">
      Tip: Hold <kbd>Alt</kbd> while clicking a link to bypass Downstream.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
